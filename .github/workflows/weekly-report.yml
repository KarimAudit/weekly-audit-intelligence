name: Weekly Audit Intelligence Report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  generate-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SENDER_EMAIL: ${{ secrets.SMTP_USER }}
      SENDER_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RECIPIENT_EMAILS: ${{ vars.RECIPIENT_EMAILS }}
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: "465"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify email environment
        shell: bash
        run: |
          echo "SENDER_EMAIL present: $([[ -n "$SENDER_EMAIL" ]] && echo YES || echo NO)"
          echo "SENDER_PASSWORD present: $([[ -n "$SENDER_PASSWORD" ]] && echo YES || echo NO)"
          echo "RECIPIENT_EMAILS present: $([[ -n "$RECIPIENT_EMAILS" ]] && echo YES || echo NO)"
          echo "SMTP_SERVER: $SMTP_SERVER"
          echo "SMTP_PORT: $SMTP_PORT"

      - name: Generate and send report
        run: |
          python scripts/main.py

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/
          git diff --cached --quiet || git commit -m "Automated weekly audit intelligence report"
          git push
